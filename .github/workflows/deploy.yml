name: Deploy to Google Apps Script

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}

      # --- Backend: Cloud Functions (PIN/password checks) + Firestore
      # security rules. Deployed before the new app code goes out, so the
      # server-side pieces the new app relies on already exist by the time
      # anyone loads it.
      #
      # Authenticated via a CI token from `firebase login:ci`, rather than a
      # service account key -- this project's service-account-based auth was
      # silently failing in CI (both firebase-tools' own credential
      # auto-detection and a community Docker action wrapping it), so this
      # falls back to the CLI's oldest, most battle-tested CI auth path.
      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules and Cloud Functions
        run: firebase deploy --only firestore:rules,functions --project "$FIREBASE_PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Package for Apps Script (inline everything into one file)
        run: node scripts/build-appsscript.mjs

      - name: Restore clasp credentials
        run: echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Push code to Apps Script
        run: clasp push --force

      - name: Update the live deployment
        run: clasp deploy --deploymentId AKfycbwGou7crZWOF4Thhk7eHWHNJtQIgmiOTtI9WT9sXBAgNJlgCmsatwUxnXC6j89TL3Gl5A --description "Automated deploy from GitHub Actions"
